# The ONLY CI this repo has, and deliberately the smallest thing that does the job.
#
# v1.32.0 retired CIVerd. The plan's argument was that the SIGNING bought nothing — three
# releases shipped unsigned with no observable consequence — and that is right. But signing
# and independent RE-EXECUTION are different properties, and only the first was worthless.
# CIVerd also re-ran the gate from a clean clone on a machine the coding agent cannot reach.
# Without a replacement, "gate green" degrades from verified to asserted: the only evidence
# would be a run on the agent's own machine, reported by the agent. capabilities.json records
# a live incident of exactly that class (CHANGELOG.md: a piped gate run certified a
# repo-red commit — the citation was mis-filed to capabilities.json in the first draft
# of this comment, which is the kind of thing a citation gate exists to catch).
#
# So this job re-runs the gate, and does NOTHING else. No verdict, no signature, no ledger,
# no issuer key, no VPS, no tailnet, no polling, no artifact the release path consumes. There
# is nothing here to forge, because nothing here authorizes anything: David reads the check
# mark before tagging, and the tag is still the only authorization (see release-tag-authority).
name: gate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# One run per ref: this repo checkpoints at every phase boundary, so without a concurrency
# group a busy branch queues a full gate per WIP commit — and runs people learn to ignore are
# exactly what this capability is guarding against.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read          # least privilege; notably NOT write, so this job cannot create a tag

jobs:
  gate:
    runs-on: ubuntu-24.04   # pinned, not -latest: a floating image is not a clean room (§10)
    timeout-minutes: 30
    steps:
      # SHA-pinned, not @v4 — §10: determinism comes from pinning, not from the vendor.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0    # the gate's ledger stage resolves a baseline from tags and the
          fetch-tags: true  # ledger EPOCH; a shallow clone makes it UNMEASURED, not green
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # The blessed entrypoint, unpiped. A piped $? is `tail`'s, which is how a scarlet gate
      # gets recorded as a pass (§4a: a discarded exit code is a discarded truth).
      - name: gate
        run: |
          sh scripts/civerd_gate.sh
