# civerd-integrity.yml — the repo-side handoff to the CIVerd engine (trust-floor contract §4).
# Paths and the real suite command ONLY. Plant recipes, the last-green baseline, the
# ratification store, and the decomposition are ENGINE-owned (root config, no agent write
# path). Shrinking this list is itself a diff-integrity signal (§1: the manifest is in the
# baseline inventory) — the two checks interlock.
plant_targets:
  - path: gate-manifest.json
  - path: plugins/tdd-playbook/bin/gate_plan.py
  - path: plugins/tdd-playbook/bin/gate_runner.py
  - path: plugins/tdd-playbook/bin/verify_verdict.py
  - path: plugins/tdd-playbook/bin/_ed25519_verify.py
  - path: plugins/tdd-playbook/bin/capability_registry.py
  - path: calibration/check_scoreboard_integrity.py
  # v1.24 (D12c): the §6c Tier-1 sweep joins the engine-side plant coverage every other
  # shipped checker here carries — a checker outside the plant rotation is a net nobody
  # has watched catch anything.
  - path: plugins/tdd-playbook/bin/dataflow_sweeps.py
# THE blessed gate entrypoint (v1.21.0) — runs the plugins loop AND the calibration
# harness. Never bare pytest (v1.15.0 false-green: pytest collects ~0 items from the
# script-style suites), never a prose shell loop (2026-07-28 probe run 2: the loop and
# the real gate had silently diverged and calibration/ was untested by the gate).
suite_cmd: "sh scripts/civerd_gate.sh"
